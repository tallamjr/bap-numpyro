name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv sync --group dev
      - name: Execute all notebooks
        run: uv run pytest --nbmake notebooks/ -v --durations=0
  deploy-book:
    needs: [notebooks]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv sync --group dev
      - name: Register the bap-numpyro Jupyter kernel
        run: uv run python -m ipykernel install --user --name bap-numpyro --display-name "Python (bap-numpyro)"
      - run: uv run jupyter-book build .
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
